name: Webserv CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Клонируем репозиторий
      - name: Checkout code
        uses: actions/checkout@v4

      # Устанавливаем компилятор
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl

      # Сборка проекта
      - name: Build (debug)
        run: |
          make fclean
          make debug

      # Проверка запуска
      - name: Smoke test (debug build)
        env:
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:strict_string_checks=1:check_initialization_order=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: |
          set -euo pipefail

          ./webserv config/default.conf &
          PID=$!

          cleanup()
          {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          # Ждём готовности сервера (до 12 секунд)
          READY=0
          for i in $(seq 1 60); do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "Server process exited early"
              exit 1
            fi

            if curl -4 -sS --max-time 1 http://127.0.0.1:8080/ >/dev/null; then
              READY=1
              break
            fi
            sleep 0.2
          done
          if [ "$READY" -ne 1 ]; then
            echo "Server did not become ready in time"
            exit 1
          fi

          # Проверяем статус ответа
          CODE=$(curl -sS --max-time 2 -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/)
          if [ "$CODE" != "200" ]; then
            echo "Expected 200, got $CODE"
            exit 1
          fi
          echo "OK: got $CODE"
          
          #Второй запрос - убеждаемся что сервер не падает после первого
          curl -sS --max-time 2 http://127.0.0.1:8080/ >/dev/null
          echo "OK: second request passed"

          # Enable this when server supports 404 properly
          # curl -sS --max-time 2 -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/notfound | grep -E "^(404)$"
