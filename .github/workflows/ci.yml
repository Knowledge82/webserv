name: Webserv CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Клонируем репозиторий
      - name: Checkout code
        uses: actions/checkout@v4

      # Устанавливаем компилятор
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl

      # Сборка проекта
      - name: Build (debug)
        run: |
          make fclean
          make debug

      # Проверка запуска
      - name: Smoke test (debug build)
        run: |
          set -euo pipefail

          ./webserv config/default.conf &
          PID=$!

          cleanup()
          {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          # Wait until server accepts connections
          for i in $(seq 1 20); do
            if curl -sS --max-time 1 http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            sleep 0.2
          done

          # Basic request should succeed
          curl -sS --max-time 2 -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/ | grep -E "^(200)$"

          # Enable this when server supports 404 properly
          # curl -sS --max-time 2 -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/notfound | grep -E "^(404)$"

      # Тесты
      - name: Smoke test
        env:
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:strict_string_checks=1:check_initialization_order=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: |
          set -euo pipefail
          
          ./webserv config/default.conf &
          PID=$!

          cleanup()
          {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT
         
          for i in $(seq 1 20); do
           if curl -sS --max-time 1 http://127.0.0.1:8080/ >/dev/null; then
             break
           fi
           sleep 0.2
          done
 
          # Request to exercise basic paths
          curl -sS --max-time 2 http://127.0.0.1:8080/ >/dev/null
          curl -sS --max-time 2 http://127.0.0.1:8080/ >/dev/null
