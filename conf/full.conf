server {
    listen 127.0.0.1:8080;
    root ./www;
    index index.html;

    # Базовая статика — только GET
    location / {
        allow_methods GET;
    }

    # Autoindex — листинг директории без index файла
    location /docs/ {
        allow_methods GET;
        root ./www/files;
        autoindex on;
    }

    # Редирект
    location /old-page {
        return 301 /;
    }

    # Upload через POST/PUT, плюс DELETE для удаления загруженного
    location /upload {
        allow_methods POST PUT DELETE GET;
        upload_dir ./www/uploads;
    }

    # /post_body — спец-роут с лимитом тела
    location /post_body {
        allow_methods POST;
        client_max_body_size 100;
    }

    # CGI на Python по расширению .py
    location /cgi-bin/ {
        allow_methods GET POST;
        root ./www/cgi-bin;
        cgi .py /usr/bin/python3;
    }

    # alias + CGI .bla (как для tester'а)
    location /directory/ {
        allow_methods GET POST;
        alias ./YoupiBanane/;
        index youpi.bad_extension;
        autoindex off;
        cgi .bla ./cgi_tester;
    }
}

# Второй сервер на другом порту — проверка multi-server
server {
    listen 127.0.0.1:8081;
    root ./www2;
    index index.html;

    location / {
        allow_methods GET POST;
    }
}
