server {
    listen 127.0.0.1:8080;

    root ./www;
    index index.html;

    location / {
        allow_methods GET;
    }

    location /post_body {
        allow_methods POST;
        client_max_body_size 100;
  }

    location /directory/ {
        allow_methods GET POST;
        alias ./YoupiBanane/;
        index youpi.bad_extension;
        autoindex off;
	cgi .bla ./cgi_tester;
    }
}
