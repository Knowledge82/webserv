server {
    listen 127.0.0.1:8080;

    # root for normal site
    root ./www;
    index index.html;

    location / {
        allow_methods GET;
    }

    location /post_body {
        allow_methods POST;
        client_max_body_size 100;
        # response can be anything for POST (позже сделаем норм)
    }

    location /directory/ {
        allow_methods GET;
        alias ./YoupiBanane/;
        index youpi.bad_extension;
        autoindex off;   # можно и on, но тестер хочет index-файл
    }

    # позже:
    # location ~ \.bla$ { ... CGI ... }
}
